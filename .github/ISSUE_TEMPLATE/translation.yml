name: Offer a translation
description: Help make Reprint usable in your language — no programming needed
title: "Translation: "
labels: ["translation", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        **You do not need to write any code to do this.**

        Reprint is used in offices all over the world, and an English-only interface is the single
        biggest thing stopping people from using it. If you can translate the text, someone else
        will put it into the app.

        Write in your own language throughout if that's easier — no need to explain yourself in
        English.

  - type: input
    id: language
    attributes:
      label: Which language?
      placeholder: e.g. Urdu (اردو), Brazilian Portuguese, Hausa
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: Is it written right-to-left?
      description: Arabic, Urdu, Hebrew, Persian and others are. This changes how the page is laid out.
      options:
        - "No, left to right"
        - "Yes, right to left"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: what
    attributes:
      label: What would you like to do?
      multiple: true
      options:
        - Translate the whole interface
        - Translate just the printing instructions
        - Check and correct a translation someone else has done
        - Something else
    validations:
      required: false

  - type: textarea
    id: strings
    attributes:
      label: Translations
      description: |
        Start with these if you like — they are the most important sentences in the app, because
        getting them wrong wastes someone's paper. Paste your translation next to each one, or just
        say hello and we'll send you the full list.
      value: |
        Reprint =
        Add content to a printed page =
        Print both sides (manual duplex) =
        Find the blank area for me =
        Download merged PDF =
        Base page — the sheet already printed =
        Content to add =
        Print the fronts file. =
        Put that stack straight back into the paper tray, flipped over. =
        Print the backs file. =
        Always test with 4 sheets of scrap paper before running 200 pages. =
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything that doesn't translate well?
      description: |
        Some of this is printing jargon that may not exist in your language, or may be said
        completely differently. If a phrase would confuse someone in your country, please say so —
        that's more valuable than a literal translation.
    validations:
      required: false
